plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

def buildTimestamp = new Date().format("yyyyMMddHHmmss", TimeZone.getTimeZone("UTC"))
version = "${project.mod_version}+${buildTimestamp}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/chattabs.accesswidener")
}

dependencies {
    // Minecraft 26.x ships unobfuscated — no mappings dependency needed.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional at runtime: only used by the ModMenu entrypoint class.
    compileOnly "com.terraformersmc:modmenu:21.0.0-beta.1"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Client gametests: ./gradlew runClientGameTest (opens a Minecraft window). Never part of `build`.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "chattabs-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
        username = "Tester"
    }
}

dependencies {
    gametestImplementation fabricApi.module("fabric-client-gametest-api-v1", project.fabric_version)
}

tasks.configureEach { task ->
    if (task.name == "runClientGameTest") {
        task.onlyIf("run explicitly") { gradle.startParameter.taskNames.any { it.contains("runClientGameTest") } }
    }
}
